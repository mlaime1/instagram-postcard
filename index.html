<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Instagram</title>
</head>

<body>
    <h1>Instagram postcard</h1>
    <div class="card">
        <div class="header-card">
            <span>
                <img src="" alt="">
                <b>User</b>
            </span>
            <i>...</i>
        </div>
        <div class="image">
            <img src="https://ae01.alicdn.com/kf/S1e17f4ab967e419ab144c8f46f94b8ffv.jpg" alt="snoopy-van-googh">
        </div>
        <div class="content-card">
            <div>
                <span><i>corazon</i><i>chat</i><i>compartir</i></span>
                <span>guardar</span>
            </div>
            <div>
                <span>
                    <i>❤</i>
                    <b>5231 likes</b>
                </span>
            </div>
            <div>
                <span>
                    <b>User</b> Lorem ipsum dolor sit amet consectetur adipisicing elit
                </span>
                <span class="hashtag">
                    #Lorem #ipsum #dolor #sit #amet #consectetur #adipisicing #elit. #Ea, #excepturi!
                </span>
            </div>
        </div>
    </div>
</body>

</html>
